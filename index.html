<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churupitos | Calculadora de Tasas BCV y Binance P2P en Venezuela</title>
    <meta name="description" content="Calculadora de divisas instantánea para Venezuela. Convierte dólares (USD), euros (EUR) y USDT a bolívares (VES) con tasas oficiales del BCV y Binance P2P actualizadas.">
    <meta name="theme-color" content="#0b0c10">
    
    <!-- Open Graph / Redes Sociales -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Churupitos · Calculadora de Divisas BCV y Binance">
    <meta property="og:description" content="Conversión rápida y precisa entre Dólar BCV, Euro, USDT y Bolívares. Tasas en tiempo real.">
    <meta property="og:locale" content="es_VE">
    
    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
  <main class="app-layout">
    <!-- Cabecera -->
    <header class="app-header">
      <div class="brand">
        <h1 class="brand-title">
          Churupitos
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="brand-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M0 5a5 5 0 0 0 4.027 4.905 6.5 6.5 0 0 1 .544-2.073C3.695 7.536 3.132 6.864 3 5.91h-.5v-.426h.466V5.05q-.001-.07.004-.135H2.5v-.427h.511C3.236 3.24 4.213 2.5 5.681 2.5c.316 0 .59.031.819.085v.733a3.5 3.5 0 0 0-.815-.082c-.919 0-1.538.466-1.734 1.252h1.917v.427h-1.98q-.004.07-.003.147v.422h1.983v.427H3.93c.118.602.468 1.03 1.005 1.229a6.5 6.5 0 0 1 4.97-3.113A5.002 5.002 0 0 0 0 5m16 5.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0m-7.75 1.322c.069.835.746 1.485 1.964 1.562V14h.54v-.62c1.259-.086 1.996-.74 1.996-1.69 0-.865-.563-1.31-1.57-1.54l-.426-.1V8.374c.54.06.884.347.966.745h.948c-.07-.804-.779-1.433-1.914-1.502V7h-.54v.629c-1.076.103-1.808.732-1.808 1.622 0 .787.544 1.288 1.45 1.493l.358.085v1.78c-.554-.08-.92-.376-1.003-.787zm1.96-1.895c-.532-.12-.82-.364-.82-.732 0-.41.311-.719.824-.809v1.54h-.005zm.622 1.044c.645.145.943.38.943.796 0 .474-.37.8-1.02.86v-1.674z"/>
          </svg>
        </h1>
        <p class="brand-subtitle">Tasas oficiales BCV y Binance P2P</p>
      </div>
      <button type="button" class="refresh-btn" id="refresh-btn" aria-label="Actualizar tasas" title="Actualizar tasas ahora">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
          <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
        </svg>
      </button>
    </header>

    <!-- Lista Espaciosa de Divisas -->
    <section class="currency-list" aria-label="Campos de conversión de divisas">
      
      <!-- USD: Dólar BCV -->
      <article class="currency-tile" id="tile-usd">
        <div class="currency-tile__header">
          <div class="currency-tile__label-group">
            <span class="currency-pill">USD</span>
            <label for="usd-input" class="currency-name">Dólar BCV</label>
          </div>
          <span class="currency-tile__rate" id="rate-usd">Tasa: Bs. --,--</span>
        </div>
        <div class="currency-tile__input-box">
          <span class="currency-symbol" aria-hidden="true">$</span>
          <input type="text" id="usd-input" value="1,00" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Monto en Dólares">
          <div class="currency-tile__actions">
            <button type="button" class="icon-btn" data-input="usd-input" data-action="decrement" aria-label="Disminuir USD" title="Disminuir (-1)">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 7.5h9v1h-9z"/></svg>
            </button>
            <button type="button" class="icon-btn" data-input="usd-input" data-action="increment" aria-label="Aumentar USD" title="Aumentar (+1)">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.5 3.5h1v4h4v1h-4v4h-1v-4h-4v-1h4z"/></svg>
            </button>
            <button type="button" class="icon-btn icon-btn--reset" data-input="usd-input" data-action="reset" aria-label="Reiniciar USD" title="Reiniciar a 1">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/></svg>
            </button>
            <button type="button" class="icon-btn icon-btn--copy" data-input="usd-input" data-action="copy" aria-label="Copiar USD" title="Copiar monto">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1zM9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
            </button>
          </div>
        </div>
      </article>

      <!-- EUR: Euro BCV -->
      <article class="currency-tile" id="tile-eur">
        <div class="currency-tile__header">
          <div class="currency-tile__label-group">
            <span class="currency-pill">EUR</span>
            <label for="eur-input" class="currency-name">Euro BCV</label>
          </div>
          <span class="currency-tile__rate" id="rate-eur">Tasa: Bs. --,--</span>
        </div>
        <div class="currency-tile__input-box">
          <span class="currency-symbol" aria-hidden="true">€</span>
          <input type="text" id="eur-input" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Monto en Euros">
          <div class="currency-tile__actions">
            <button type="button" class="icon-btn" data-input="eur-input" data-action="decrement" aria-label="Disminuir EUR" title="Disminuir (-1)">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 7.5h9v1h-9z"/></svg>
            </button>
            <button type="button" class="icon-btn" data-input="eur-input" data-action="increment" aria-label="Aumentar EUR" title="Aumentar (+1)">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.5 3.5h1v4h4v1h-4v4h-1v-4h-4v-1h4z"/></svg>
            </button>
            <button type="button" class="icon-btn icon-btn--reset" data-input="eur-input" data-action="reset" aria-label="Reiniciar EUR" title="Reiniciar a 1">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/></svg>
            </button>
            <button type="button" class="icon-btn icon-btn--copy" data-input="eur-input" data-action="copy" aria-label="Copiar EUR" title="Copiar monto">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1zM9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
            </button>
          </div>
        </div>
      </article>

      <!-- USDT: Binance P2P -->
      <article class="currency-tile" id="tile-usdt">
        <div class="currency-tile__header">
          <div class="currency-tile__label-group">
            <span class="currency-pill currency-pill--usdt">USDT</span>
            <label for="usdt-input" class="currency-name">Promedio Binance P2P</label>
          </div>
          <span class="currency-tile__rate" id="rate-usdt">Tasa: Bs. --,--</span>
        </div>
        <div class="currency-tile__input-box">
          <span class="currency-symbol" aria-hidden="true">₮</span>
          <input type="text" id="usdt-input" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Monto en USDT">
          <div class="currency-tile__actions">
            <button type="button" class="icon-btn" data-input="usdt-input" data-action="decrement" aria-label="Disminuir USDT" title="Disminuir (-1)">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 7.5h9v1h-9z"/></svg>
            </button>
            <button type="button" class="icon-btn" data-input="usdt-input" data-action="increment" aria-label="Aumentar USDT" title="Aumentar (+1)">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.5 3.5h1v4h4v1h-4v4h-1v-4h-4v-1h4z"/></svg>
            </button>
            <button type="button" class="icon-btn icon-btn--reset" data-input="usdt-input" data-action="reset" aria-label="Reiniciar USDT" title="Reiniciar a 1">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/></svg>
            </button>
            <button type="button" class="icon-btn icon-btn--copy" data-input="usdt-input" data-action="copy" aria-label="Copiar USDT" title="Copiar monto">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1zM9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
            </button>
          </div>
        </div>
      </article>

      <!-- VES: Bolívares (Destacado) -->
      <article class="currency-tile currency-tile--highlight" id="tile-ves">
        <div class="currency-tile__header">
          <div class="currency-tile__label-group">
            <span class="currency-pill currency-pill--ves">VES</span>
            <label for="ves-input" class="currency-name">Bolívares</label>
          </div>
          <span class="currency-tile__rate currency-tile__rate--ves" id="rate-spread">Tasa BCV Oficial</span>
        </div>
        <div class="currency-tile__input-box">
          <span class="currency-symbol currency-symbol--ves" aria-hidden="true">Bs.</span>
          <input type="text" id="ves-input" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Monto en Bolívares">
          <div class="currency-tile__actions">
            <button type="button" class="icon-btn icon-btn--copy icon-btn--ves" data-input="ves-input" data-action="copy" aria-label="Copiar Bolívares" title="Copiar monto">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1zM9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
            </button>
          </div>
        </div>
      </article>

    </section>

    <!-- Barra de Estado Integrada (Footer) -->
    <footer class="status-bar" role="status" aria-live="polite">
      <div class="status-bar__left">
        <span class="status-dot status-dot--loading" id="estado-badge" aria-hidden="true"></span>
        <span class="status-badge-text" id="estado-badge-text">Cargando tasas…</span>
      </div>
      <div class="status-bar__right" id="estado-api">
        <span id="estado-weekday" class="visually-hidden"></span>
        <span id="estado-day" class="api-status__date-line--loading">Consultando API...</span>
        <span class="status-dot-separator">·</span>
        <span id="estado-meta"></span>
      </div>
    </footer>
  </main>

  <!-- Notificación Toast de copiado -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/></svg>
    <span id="toast-text">Copiado</span>
  </div>
</body>
</html>
